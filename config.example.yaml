listen: ":8000"
vllm_socket_dir: "/run/vllm"
llama_cpp_socket_dir: "/run/llama"
llama_cpp_model_dir: "/data/llama/models"
queue_depth: 100

ttl_active: 10m
ttl_inactive: 60m
ttl_unused: 120m

gpu_groups:
  - id: "group0"
    gpus: [0, 1, 2, 3]       # CUDA device IDs in this group
                                # Total VRAM is measured from nvidia-smi at startup

  - id: "group1"
    gpus: [4]                  # Single-GPU group example

models:
  - name: "meta-llama/Meta-Llama-3-8B-Instruct"
    aliases: ["llama3-8b", "llama3"]
    load_at_startup: false
    vram_allocation: 75162    # 0.92 * 24576 * 4 GPUs — adjust to your group total and desired utilization
    vllm_args:
      - "--dtype=float16"
      - "--max-model-len=8192"
      - "--enable-prefix-caching"
      - "--tool-call-parser=hermes"

  - name: "mistralai/Mistral-7B-Instruct-v0.3"
    aliases: ["mistral-7b", "mistral"]
    load_at_startup: false
    vram_allocation: 75162
    vllm_args:
      - "--dtype=float16"
      - "--max-model-len=32768"

  # AWQ quantized example — lower VRAM footprint
  - name: "casperhansen/llama-3-70b-instruct-awq"
    aliases: ["llama3-70b-awq"]
    load_at_startup: false
    vram_allocation: 75162
    vllm_args:
      - "--dtype=auto"
      - "--quantization=awq"
      - "--max-model-len=8192"

  # Vision-language model example
  - name: "llava-hf/llava-1.5-7b-hf"
    aliases: ["llava"]
    load_at_startup: false
    vram_allocation: 75162
    vllm_args:
      - "--dtype=float16"
      - "--max-model-len=4096"

  # llama.cpp (GGUF) model example
  - name: "unsloth/Qwen3.6-27B-MTP-GGUF"
    aliases: ["qwen3.6-27b-gguf"]
    engine: llama_cpp
    gguf_path: "Qwen3.6-27B-MTP-Q4_K_M.gguf"   # resolved as /data/llama/models/Qwen3.6-27B-MTP-Q4_K_M.gguf
    vram_allocation: 22000                       # MB; authoritative, no runtime measurement
    ttl_unused: 60m                              # sole idle-to-kill timer for this model
    llama_cpp_args:
      - "-ngl"
      - "auto"      # or an explicit layer count, or "all"/"0" for full-GPU/full-CPU
      - "-t"
      - "16"
      - "-fa"
      - "on"
