listen: ":8000"
vllm_socket_dir: "/run/vllm"
queue_depth: 100

ttl_active: 10m
ttl_inactive: 60m
ttl_unused: 120m

gpu_groups:
  - id: "group0"
    gpus: [0, 1]

models:
  - name: "Qwen/Qwen2.5-32B-Instruct-AWQ"
    aliases: ["qwen2.5-32b", "qwen2.5-32b-awq"]
    load_at_startup: false
    vram_estimate_mb: 28000
    vllm_args:
      - "--dtype=auto"
      - "--quantization=awq_marlin"
      - "--max-model-len=16384"
      - "--enable-prefix-caching"
      - "--tool-call-parser=hermes"
      - "--disable-custom-all-reduce"

  - name: "Qwen/Qwen3-14B-AWQ"
    aliases: ["qwen3-14b"]
    load_at_startup: false
    vram_estimate_mb: 10000
    vllm_args:
      - "--dtype=auto"
      - "--quantization=awq_marlin"
      - "--max-model-len=32768"
      - "--enable-prefix-caching"
      - "--tool-call-parser=hermes"
      - "--disable-custom-all-reduce"

  - name: "TechxGenus/DeepSeek-Coder-V2-Lite-Instruct-AWQ"
    aliases: ["deepseek-coder", "deepseek-coder-v2-lite"]
    load_at_startup: false
    vram_estimate_mb: 10000
    vllm_args:
      - "--dtype=auto"
      - "--quantization=awq_marlin"
      - "--max-model-len=32768"
      - "--enable-prefix-caching"
      - "--trust-remote-code"
      - "--disable-custom-all-reduce"

  - name: "Qwen/Qwen2.5-Coder-32B-Instruct-AWQ"
    aliases: ["qwen2.5-coder-32b", "qwen-coder"]
    load_at_startup: false
    vram_estimate_mb: 28000
    vllm_args:
      - "--dtype=auto"
      - "--quantization=awq_marlin"
      - "--max-model-len=16384"
      - "--enable-prefix-caching"
      - "--tool-call-parser=hermes"
      - "--disable-custom-all-reduce"

  - name: "cyankiwi/Qwen3-VL-8B-Instruct-AWQ-4bit"
    aliases: ["qwen3-vl", "qwen3-vl-8b"]
    load_at_startup: false
    vram_estimate_mb: 12000
    vllm_args:
      - "--dtype=auto"
      - "--quantization=awq_marlin"
      - "--max-model-len=8192"
      - "--enable-prefix-caching"
      - "--disable-custom-all-reduce"
